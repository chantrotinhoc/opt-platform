name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: make test

  worker:
    name: scan workflow (Temporal test server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt temporalio==1.37.0 pytest-asyncio==1.5.0
      - run: PYTHONPATH=apps/worker python -m pytest -q apps/worker -o asyncio_mode=auto
        env: { OPT_REQUIRE_TEMPORAL: "1" }

  db:
    name: tenant isolation (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: dev, POSTGRES_DB: opt }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations and dev seed
        env: { PGPASSWORD: dev }
        run: |
          for f in db/migrations/*.sql deploy/dev/*.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d opt -f "$f"
          done
      - run: make test-db

  smoke:
    name: boot smoke test (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: make smoke
      - if: failure()
        run: docker compose -f docker-compose.dev.yml logs

  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with: { version: 1.4.2 }
      - run: opa test policies -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1", version: "v0.76.2" }
