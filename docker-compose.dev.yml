# Local development only. All ports bind to 127.0.0.1; credentials are throwaway. Production runs on Kubernetes in the ITSTARVN data center.
# `make up` starts postgres, keycloak, api and a lab target (lab-web). `docker compose -f docker-compose.dev.yml --profile full up -d`
# also starts Temporal, OPA and MinIO (needed from S3/S4).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: opt }
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./deploy/dev/initdb.sh:/docker-entrypoint-initdb.d/00_initdb.sh:ro
      - ./db/migrations:/opt/opt-sql/migrations:ro
      - ./deploy/dev:/opt/opt-sql/dev:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "opt"]
      interval: 2s
      retries: 30

  keycloak:
    image: keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev
      # Tokens always carry iss=http://localhost:8080/realms/opt, whether the
      # browser or the api container (via http://keycloak:8080) talks to Keycloak.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes: ["./deploy/dev/keycloak:/opt/keycloak/data/import:ro"]
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q UP <&3']
      interval: 5s
      retries: 60

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      OPT_DATABASE_URL: postgresql://opt_app:opt_app_dev@postgres:5432/opt
      OPT_OIDC_ISSUER: http://localhost:8080/realms/opt
      OPT_OIDC_JWKS_URL: http://keycloak:8080/realms/opt/protocol/openid-connect/certs
      OPT_OIDC_AUDIENCE: opt-api
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  # Lab target the demo tenant may scan. Reachable only inside this compose
  # network, under the verified seed name juice.lab.example.vn. Never point
  # scans at hosts you do not own and have no signed RoE for.
  lab-web:
    image: nginx:1.27.4-alpine
    networks:
      default:
        aliases: [juice.lab.example.vn]

  temporal:
    profiles: [full]
    image: temporalio/auto-setup:1.24
    environment: { DB: postgres12, DB_PORT: 5432, POSTGRES_USER: postgres, POSTGRES_PWD: dev, POSTGRES_SEEDS: postgres }
    ports: ["127.0.0.1:7233:7233"]
    depends_on:
      postgres: { condition: service_healthy }

  opa:
    profiles: [full]
    image: openpolicyagent/opa:1.4.2
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    volumes: ["./policies:/policies:ro"]
    ports: ["127.0.0.1:8181:8181"]

  minio:
    profiles: [full]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
